name: CI

on:
  push:
    branches: master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-node@v2
        with:
          node-version: 22

      - uses: purescript-contrib/setup-purescript@main
        with:
          purescript: "0.15.12"
          spago: "1.0.5"

      - run: spago build

      - run: spago test
